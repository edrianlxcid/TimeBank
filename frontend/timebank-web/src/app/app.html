@if (auth.currentUser(); as user) {
  <header class="topbar">
    <a class="brand" routerLink="/inicio">Time<span>Bank</span></a>

    <nav>
      <a routerLink="/inicio" routerLinkActive="active">Inicio</a>
      <!-- El menú cambia según el rol: solo el Administrador ve "Usuarios" -->
      @if (auth.isAdmin()) {
        <a routerLink="/usuarios" routerLinkActive="active">Usuarios</a>
      }
    </nav>

    <div class="session">
      <span class="who">{{ user.firstName }} {{ user.lastName }}</span>
      @for (role of user.roles; track role) {
        <span class="role" [class.admin]="role === 'Administrador'">{{ role }}</span>
      }
      <button type="button" (click)="logout()">Cerrar sesión</button>
    </div>
  </header>
}

<main>
  <router-outlet />
</main>
