$kind: http-request
url: "{{baseUrl}}/reviews"
method: POST
headers:
  Authorization: Bearer {{adminToken}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "serviceRequestId": 1,
      "reviewerId": 2,
      "rating": 5,
      "comment": "Excelente profesora"
    }
order: 2000
