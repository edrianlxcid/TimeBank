$kind: http-request
url: "{{baseUrl}}/auth/me"
method: PUT
headers:
  Content-Type: application/json
  Authorization: Bearer {{token}}
body:
  type: json
  content: |-
    {
      "firstName": "Laura",
      "lastName": "Torres Vega",
      "phone": "0998887766"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Responde 200 OK', () => pm.response.to.have.status(200));
order: 7000
