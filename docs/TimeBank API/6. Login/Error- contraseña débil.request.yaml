$kind: http-request
description: La contraseña debe tener mínimo 8 caracteres, mayúscula, minúscula, número y carácter especial.
url: "{{baseUrl}}/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "firstName": "Luis",
      "lastName": "Mora",
      "email": "luis.mora@mail.com",
      "password": "clave123"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Responde 400 Bad Request', () => pm.response.to.have.status(400));
order: 2500
